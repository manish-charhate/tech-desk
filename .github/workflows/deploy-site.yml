name: Deploy site

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "agent/build_site.py"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # pick up the data commit made earlier in this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m agent.build_site   # stdlib only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
