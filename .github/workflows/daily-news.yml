name: Daily news

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST. GitHub may start scheduled runs a few minutes late.
  workflow_dispatch:        # "Run workflow" button, and /news from Telegram

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-writes        # never let two jobs push to the repo at the same time
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and curate
        run: python -m agent.news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
      - name: Save to repo
        run: |
          git config user.name "tech-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "news: $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase && git push

  deploy:
    needs: news
    uses: ./.github/workflows/deploy-site.yml
