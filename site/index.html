<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Tech desk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Archive">
      <a class="brand" href="#/">Tech desk</a>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-news" aria-selected="true" data-tab="news">Daily news</button>
        <button role="tab" id="tab-topics" aria-selected="false" data-tab="topics">Topics</button>
      </div>
      <label class="picker">
        <span class="sr-only">Jump to</span>
        <select id="picker"></select>
      </label>
      <ol class="list" id="list"></ol>
    </nav>
    <main id="main" tabindex="-1">
      <p class="loading">Loading…</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
